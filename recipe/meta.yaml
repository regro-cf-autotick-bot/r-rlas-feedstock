{% set version = "1.9.3" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-rlas
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/rlas_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/rlas/rlas_{{ version }}.tar.gz
  sha256: 1ff66e77ffbcb594d0580a85e8ba33156a88881cbb770c0cdb1135f853575705

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
    - r-data.table                 # [build_platform != target_platform]
    - r-rcpp                       # [build_platform != target_platform]
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib("c") }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib("m2w64_c") }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}sed               # [win]
    - {{ posix }}grep              # [win]
    - {{ posix }}autoconf
    - {{ posix }}automake          # [not win]
    - {{ posix }}automake-wrapper  # [win]
    - pkg-config
    - {{ posix }}make
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-data.table
    - r-rcpp
    - libgdal-core-devel
    - libgdal-core
  run:
    - r-base
    - r-data.table
    - r-rcpp
    - {{ pin_compatible('proj') }}
    - {{ pin_compatible('libgdal-core') }}

test:
  requires:
    - r-tinytest
  commands:
    - $R -e "library('rlas')"                          # [not win]
    - $R -e "tinytest::test_package('rlas')"           # [not win]
    - "\"%R%\" -e \"library('rlas')\""                 # [win]
    - "\"%R%\" -e \"tinytest::test_package('rlas')\""  # [win]

about:
  home: https://github.com/Jean-Romain/rlas
  license: GPL-3.0-only
  summary: Read and write 'las' and 'laz' binary file formats. The LAS file format is a public file format for the interchange of 3-dimensional point cloud data between data users. The LAS specifications are approved by the American Society for Photogrammetry and Remote Sensing 
    <https://www.asprs.org/committee-general/laser-las-file-format-exchange-activities.html>. The LAZ file format is an open and lossless compression scheme for binary LAS format versions 1.0 to 1.3 <https://www.laszip.org/>.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
    - ocefpaf
